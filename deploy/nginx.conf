# K-Buddy — 단일 EC2 리버스 프록시
#
#   Internet :80
#     ├─ /api/v1/…, /healthz, /docs, /openapi.json  →  api:10000  (FastAPI)
#     └─ /                                           →  web:3000   (Next.js)
#
# 한 오리진으로 묶는 것이 목적이다. 프런트와 API 가 같은 호스트에서 나오면
# CORS 가 애초에 발생하지 않고, `NEXT_PUBLIC_API_BASE` 도 상대 경로(`/api/v1`)로
# 끝난다 — 배포 URL 이 바뀔 때마다 프런트를 다시 빌드하지 않아도 된다.

upstream kbuddy_api {
    server api:10000;
    keepalive 16;
}

upstream kbuddy_web {
    server web:3000;
    keepalive 16;
}

# 프록시가 원 IP 를 잃으면 slowapi 의 "IP당 분 20회"(planner §9.1)가
# 전 이용자 공용 버킷이 된다. 아래 X-Forwarded-For 와 uvicorn 의
# `--proxy-headers` 가 한 쌍으로 동작한다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # vercel.json 이 걸어 두던 헤더를 여기서도 건다 — 배포 경로가 둘이어도
    # 이용자가 받는 응답 헤더는 같아야 한다.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 업로드는 없다. 체크리스트 POST 본문도 작다.
    client_max_body_size 1m;

    # ── API ──────────────────────────────────────────────────────────
    location ~ ^/(api/v1|healthz|docs|openapi\.json|redoc) {
        proxy_pass http://kbuddy_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ★ **SSE 의 전제다.** nginx 기본값(proxy_buffering on)이면 응답을 모아
        #   두었다가 한 번에 내보내, `/api/v1/chat` 의 토큰 스트리밍이 통째로
        #   지연된다. 화면에는 "한참 멈춰 있다가 답이 전부 튀어나오는" 형태로
        #   보이고 TTFT 계측(`ttft_ms`)이 무의미해진다.
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;
        # 프록시가 중간에서 gzip 을 걸면 스트리밍이 다시 뭉친다.
        gzip off;

        # ★ 타임아웃은 **실측에 맞춘다.** exp_012 의 생성 지연 p95 는 149초였고,
        #   `upstream_error` 문항은 cap 2048 을 그대로 태워 p50 156초였다
        #   (ADR-005 후속 ⑨). nginx 기본 60초면 정상 답변이 502 로 끊긴다.
        #   지연 자체는 아직 미해결 과제이므로 여유를 준다.
        proxy_connect_timeout 10s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
    }

    # ── 프런트 ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://kbuddy_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
    }
}
