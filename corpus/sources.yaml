  # ══════════════════════════════════════════════════════════════════
  # P2: 금융기관별 외국인 채널 (planner §5.1) — F2 매트릭스의 unknown 을 닫는다
  # ══════════════════════════════════════════════════════════════════
  #
  # ★★ **URL 이 비어 있어 전부 주석 처리되어 있다. 지어내지 않았다.**
  #
  #    각 은행 홈페이지가 JS 셸이라(182~6,296 bytes) 링크를 자동으로 찾을 수 없고,
  #    제주은행 sitemap 에도 외국인 안내 페이지가 없다(2026-08-21 확인).
  #    **URL 을 추측해 넣으면 그 순간 1차 출처가 아니게 된다** — 화면에는 여전히
  #    "출처: OO은행"이 붙으므로 오히려 근거 없는 것보다 나쁘다.
  #
  # ── 도메인은 이미 허용되어 있다 ────────────────────────────────────
  #   `corpus/scripts/_common.py :: ALLOWED_INSTITUTION_HOSTS` 에 2026-08-21 추가.
  #   EV 인증서의 조직명·법인등록번호로 소유자를 확인했다(그 파일 주석 참조).
  #     imbank.co.kr / dgb.co.kr · busanbank.co.kr · jbbank.co.kr · jejubank.co.kr
  #
  # ── 채우는 법 ──────────────────────────────────────────────────────
  #   1. 각 은행 사이트에서 **외국인 고객 안내** 페이지를 찾는다. 보통
  #      「개인 > 예금 > 외국인」 또는 「고객센터 > 외국인 고객」 아래에 있다.
  #      영문 사이트(/en, /eng)에도 같은 내용이 있으면 그쪽이 URL 이 안정적이다.
  #   2. 아래 블록의 `#` 을 지우고 `url:` 과 `published_at:` 을 채운다.
  #      published_at 은 **지금 채운다** — 나중에 몰아서 하면 다시 찾아야 하고,
  #      틀리면 시점 경고 기능 전체가 무의미해진다(planner §5.3).
  #   3. 수집·색인:
