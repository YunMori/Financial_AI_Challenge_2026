# 코퍼스 소스 목록 — 01_fetch.py 의 입력
#
# **1차 출처만 넣는다.** 도메인 화이트리스트(corpus/scripts/_common.py)가 강제하지만,
# 화이트리스트를 통과한다고 1차 출처인 것은 아니다. 정책브리핑(korea.kr)은
# 부처 발표를 재서술한 2차 자료이므로, 원문 보도자료가 있으면 그쪽을 정본으로 쓰고
# 브리핑은 보조로만 둔다(publisher_type 과 note 에 명시).
#
# published_at 은 **수집하면서 즉시** 채운다. 나중에 몰아서 하면 다시 찾아야 하고,
# 틀리면 시점 경고 기능 전체가 무의미해진다(planner §5.3).
#
# doc_id 규칙: {발행기관}-{발행일}-{주제}

sources:

  # ── P0: 한도제한계좌 (데모 시나리오 2의 핵심 근거) ──────────────────

  - doc_id: FSC-2024-0502-LIMIT
    url: https://www.fsc.go.kr/no010101/82205
    title: 24.5.2.(목)부터 한도제한계좌의 이체·ATM 거래한도가 30만원에서 100만원으로 상향됩니다
    publisher: 금융위원회
    publisher_type: government
    doc_type: press_release
    published_at: "2024-05-02"
    topics: [limited_account, transfer_limit, account_opening]
    visa_scope: [ALL]
    license_note: 공공누리 제1유형
    priority: P0
    note: >-
      부록 B2 의 1차 출처. 기획서는 "1일 한도 100만원"이라고만 서술했으나
      실제로는 전자금융·ATM 이 100만원이고 창구거래는 300만원이다.
      데모 시나리오 2("왜 100만원까지만 보낼 수 있나요")는 전자금융 맥락이라
      100만원이 맞지만, 기획서 문구는 거래유형을 명시해야 한다.

  - doc_id: FSC-2024-0502-LIMIT-PDF
    url: https://www.fsc.go.kr/comm/getFile?srvcId=BBSTY1&upperNo=82205&fileTy=ATTACH&fileNo=1
    title: 한도제한계좌 거래한도 상향 보도자료 (원문 PDF)
    publisher: 금융위원회
    publisher_type: government
    doc_type: press_release
    published_at: "2024-05-02"
    topics: [limited_account, transfer_limit]
    visa_scope: [ALL]
    license_note: 공공누리 제1유형
    priority: P0
    note: HTML 본문보다 상세한 표가 들어 있다. pdfplumber 경로 검증도 겸한다.

  - doc_id: KOREA-2024-0502-LIMIT-BRIEF
    url: https://www.korea.kr/news/policyNewsView.do?newsId=148928795
    title: 한도제한계좌 이체·ATM 한도 30만→100만원 상향
    publisher: 대한민국 정책브리핑
    publisher_type: government
    doc_type: press_release
    published_at: "2024-05-02"
    topics: [limited_account, transfer_limit]
    visa_scope: [ALL]
    license_note: 공공누리 제1유형
    priority: P0
    note: >-
      2차 자료(부처 발표 재서술). 은행별 시행일 차이(농협·하나·부산은 5.10)가
      여기에만 있어 보조 근거로 수집한다. 계층 A 근거로 쓸 때는
      FSC-2024-0502-LIMIT 을 우선한다.

