# 코퍼스 소스 목록 — 01_fetch.py 의 입력
#
# **1차 출처만 넣는다.** 도메인 화이트리스트(corpus/scripts/_common.py)가 강제하지만,
# 화이트리스트를 통과한다고 1차 출처인 것은 아니다. 정책브리핑(korea.kr)은
# 부처 발표를 재서술한 2차 자료이므로, 원문 보도자료가 있으면 그쪽을 정본으로 쓰고
# 브리핑은 보조로만 둔다(publisher_type 과 note 에 명시).
#
# published_at 은 **수집하면서 즉시** 채운다. 나중에 몰아서 하면 다시 찾아야 하고,
# 틀리면 시점 경고 기능 전체가 무의미해진다(planner §5.3).
#
# doc_id 규칙: {발행기관}-{발행일}-{주제}

sources:

