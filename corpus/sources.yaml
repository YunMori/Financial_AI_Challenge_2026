  # ── P0: 체류자격·외국인등록 (하이코리아) ────────────────────────────

  # 하이코리아는 탭 하나하나가 별도 페이지다(CAT_SEQ 로 구분). 상위 페이지를
  # 수집하면 탭 메뉴 링크와 엉뚱한 한 탭의 내용만 잡힌다 — 제목은 "외국인등록
  # 안내"인데 본문은 "변경신고"인 문서가 만들어져, 검색이 없는 내용을 하이코리아
  # 출처로 인용하게 된다. 필요한 탭을 doc 단위로 지정한다.

  - doc_id: HIKOREA-ARC-DOCS
    url: https://www.hikorea.go.kr/info/InfoDatail.pt?CAT_SEQ=177&PARENT_ID=139
    title: 외국인등록시 제출서류
    publisher: 법무부 하이코리아
    publisher_type: government
    doc_type: guideline
    topics: [residence, arc, registration, required_docs]
    visa_scope: [ALL]
    license_note: 공공누리
    priority: P0
    note: >-
      외국인등록증은 계좌개설의 전제이므로 F2/F5 의 기본 근거.
      상시 갱신 페이지라 발행일이 없다 — 본문 하단의 "최종 수정일"을
      published_at 으로 쓰고, 없으면 verified_at 이 유일한 시점 근거가 된다.

