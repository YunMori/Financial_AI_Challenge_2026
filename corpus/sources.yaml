  - doc_id: KFB-LIMIT-ACCOUNT
    url: https://portal.kfb.or.kr/voice/vphishing_system3.php
    title: 한도제한계좌 안내 (전국은행연합회 소비자포털)
    publisher: 전국은행연합회
    publisher_type: fsi
    doc_type: faq
    topics: [limited_account]
    visa_scope: [ALL]
    priority: P0
    legacy_tls: true
    allow_short: true
    note: >-
      본문 312자로 짧지만 추출 실패가 아니라 원문이 짧은 FAQ 다(3문장 완결).
      "인출·이체한도, 서류·절차, 일반계좌 전환요건은 은행마다 상이하므로 이용하는
      은행에 문의" — institutions.yaml 의 은행별 셀을 unknown 으로 두는 **공식 근거**라
      길이와 무관하게 가치가 크다. 이 페이지는 EUC-KR/UTF-8 혼합 인코딩이다.
