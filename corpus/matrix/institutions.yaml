# 요건 매트릭스 (planner §4.2)
#
# **셀 상태를 3값으로 관리한다.** 공식 문서로 전체를 채우는 것은 불가능하고,
# 억지로 채우면 그 자체가 환각이 되어 서비스의 핵심 가치(근거 기반)를 무너뜨린다.
# 모르는 칸을 모른다고 표시하는 UI 가 오히려 신뢰성 어필 포인트다.
#
#   official  해당 기관·정부의 공식 문서에 명시   → 계층 A, 출처 링크 표시
#   inferred  일반 규정에서 추론(기관 개별 명시 없음) → 계층 B, "일반적으로" + 사전확인 권고
#   unknown   근거 없음                          → 회색 처리 + "해당 은행에 직접 확인 필요"
#
# M1 범위: 6기관(모바일 ARC 근거로 확인된 전량) × 2비자. 기관 단위는 official
# 이지만 **비자별 셀은 전부 unknown 이다** — 3값 UI 를 실제로 보여주기 위한
# 최소 표본이며, 전부 채우면 검증할 화면이 사라진다.
#
# evidence 가 비어 있는데 상태가 official 인 셀은 있어서는 안 된다.
# eval/ 의 매트릭스 검증 스크립트가 이를 강제하게 될 것(M1 이후).

version: 1
updated_at: "2026-08-20"

